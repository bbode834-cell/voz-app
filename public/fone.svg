<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Fone de ouvido que encaixa na coroa da logo (mesma escala da logo) -->
  <defs>
    <linearGradient id="arco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="concha" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#374151"/><stop offset="1" stop-color="#0b0f17"/></linearGradient>
    <linearGradient id="almof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></linearGradient>
  </defs>
  <!-- arco por cima da coroa -->
  <path d="M84 112 C 78 30, 150 4, 200 4 C 250 4, 322 30, 316 112" fill="none" stroke="#0b0f17" stroke-width="26" stroke-linecap="round"/>
  <path d="M84 112 C 78 30, 150 4, 200 4 C 250 4, 322 30, 316 112" fill="none" stroke="url(#arco)" stroke-width="18" stroke-linecap="round"/>
  <path d="M110 70 C 132 34, 170 22, 200 22 C 230 22, 268 34, 290 70" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- detalhe dourado no alto -->
  <rect x="176" y="-2" width="48" height="16" rx="8" fill="#f5b82e" stroke="#a8650a" stroke-width="3"/>
  <!-- conchas (lado esquerdo e direito da coroa) -->
  <g>
    <rect x="58" y="86" width="42" height="74" rx="18" fill="url(#concha)" stroke="#05070b" stroke-width="4"/>
    <rect x="92" y="94" width="18" height="58" rx="8" fill="url(#almof)" stroke="#5f1111" stroke-width="3"/>
    <rect x="66" y="100" width="8" height="32" rx="4" fill="#fff" opacity=".18"/>
    <circle cx="79" cy="146" r="5" fill="#22c55e"/>
  </g>
  <g>
    <rect x="300" y="86" width="42" height="74" rx="18" fill="url(#concha)" stroke="#05070b" stroke-width="4"/>
    <rect x="290" y="94" width="18" height="58" rx="8" fill="url(#almof)" stroke="#5f1111" stroke-width="3"/>
    <rect x="326" y="100" width="8" height="32" rx="4" fill="#fff" opacity=".18"/>
  </g>
</svg>
